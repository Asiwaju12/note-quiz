name: Validate Recall Quiz integration

on:
  push:
    branches:
      - recall-quiz-redesign-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recall-quiz-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recall-quiz-redesign-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, build and cloud-sync tests
        run: |
          npm run typecheck
          npm run build
          npm run test:cloud-sync
      - name: Verify deployed serverless API routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://recall-quiz-git-recall-quiz-de70c3-fernandezs-projects-f1475cb5.vercel.app"
          status_code=""
          for attempt in $(seq 1 90); do
            status_code=$(curl --silent --show-error --output /tmp/ai-status.json --write-out '%{http_code}' "$BASE_URL/api/ai/status" || true)
            if [ "$status_code" = "200" ]; then break; fi
            sleep 2
          done
          if [ "$status_code" != "200" ]; then
            cat /tmp/ai-status.json || true
            echo "AI status route failed with HTTP $status_code"
            exit 1
          fi
          for route in chat generate; do
            code=$(curl --silent --show-error --output "/tmp/$route.json" --write-out '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$BASE_URL/api/ai/$route" || true)
            if [ "$code" != "503" ] && [ "$code" != "400" ] && [ "$code" != "401" ]; then
              cat "/tmp/$route.json" || true
              echo "$route route returned unexpected HTTP $code"
              exit 1
            fi
          done
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Vite server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/recall-vite.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/recall-vite.log
          exit 1
      - name: Desktop browser tests
        env:
          BASE: http://127.0.0.1:5173
        run: npm run test:e2e
      - name: Mobile browser tests
        timeout-minutes: 4
        continue-on-error: true
        env:
          BASE: http://127.0.0.1:5173
        run: npm run test:e2e:mobile
